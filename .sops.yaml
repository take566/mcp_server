# SOPS creation rules. Replace the placeholder with your age PUBLIC key
# (`age-keygen -y ~/.config/sops/age/keys.txt` on Mac/Linux,
#  `age-keygen -y %APPDATA%\sops\age\keys.txt` on Windows).
# The placeholder is deliberately invalid so `sops --encrypt` fails loudly until it is replaced.
# The age PRIVATE key is never committed.
creation_rules:
  - path_regex: infra/mcp/secrets\.sops\.yaml$
    age: age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
