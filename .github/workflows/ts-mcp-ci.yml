name: TypeScript MCP CI/CD

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress workflows on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 1: Detect Changes
  detect-changes:
    name: Detect Changed Servers
    uses: ./.github/workflows/detect-changes.yml

  # Phase 2: Build and Test Matrix
  build-and-test:
    name: Build & Test (${{ matrix.server }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript_changed == 'true'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        server: ${{ fromJson(needs.detect-changes.outputs.affected_servers) }}
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect package manager
        id: detect-pm
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          if [ -f "bun.lockb" ]; then
            echo "pm=bun" >> $GITHUB_OUTPUT
            echo "cache-path=~/.bun/install/cache" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
            echo "cache-path=~/.pnpm-store" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
            echo "cache-path=~/.npm" >> $GITHUB_OUTPUT
          fi

          echo "Detected package manager: $(cat $GITHUB_OUTPUT | grep 'pm=' | cut -d= -f2)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.detect-pm.outputs.cache-path }}
            mcp_servers/${{ matrix.server }}/node_modules
          key: ${{ runner.os }}-${{ steps.detect-pm.outputs.pm }}-${{ matrix.server }}-${{ hashFiles(format('mcp_servers/{0}/package.json', matrix.server)) }}-${{ hashFiles(format('mcp_servers/{0}/*lock*', matrix.server)) }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.detect-pm.outputs.pm }}-${{ matrix.server }}-

      - name: Install dependencies
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            bun)
              bun install --frozen-lockfile
              ;;
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Build
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            bun)
              bun run build
              ;;
            pnpm)
              pnpm run build
              ;;
            npm)
              npm run build
              ;;
          esac

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: mcp_servers/${{ matrix.server }}/dist
          key: ${{ runner.os }}-build-${{ matrix.server }}-${{ github.sha }}

      - name: Run tests
        working-directory: mcp_servers/${{ matrix.server }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            bun)
              bun test || echo "No tests or tests failed"
              ;;
            pnpm)
              pnpm test || echo "No tests or tests failed"
              ;;
            npm)
              npm test || echo "No tests or tests failed"
              ;;
          esac

  # Phase 3: Type Checking
  typecheck:
    name: TypeScript Type Check (${{ matrix.server }})
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.typescript_changed == 'true'
    timeout-minutes: 5

    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        server: ${{ fromJson(needs.detect-changes.outputs.affected_servers) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package manager
        id: detect-pm
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          if [ -f "bun.lockb" ]; then
            echo "pm=bun" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Bun
        if: steps.detect-pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: mcp_servers/${{ matrix.server }}/node_modules
          key: ${{ runner.os }}-${{ steps.detect-pm.outputs.pm }}-${{ matrix.server }}-${{ hashFiles(format('mcp_servers/{0}/package.json', matrix.server)) }}-${{ hashFiles(format('mcp_servers/{0}/*lock*', matrix.server)) }}

      - name: Run TypeScript check
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            bun)
              bun run typecheck || bunx tsc --noEmit
              ;;
            pnpm)
              pnpm typecheck || pnpm exec tsc --noEmit
              ;;
            npm)
              npm run typecheck || npx tsc --noEmit
              ;;
          esac

  # Phase 4: Code Formatting
  prettier:
    name: Prettier Check (${{ matrix.server }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.typescript_changed == 'true'
    timeout-minutes: 3

    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        server: ${{ fromJson(needs.detect-changes.outputs.affected_servers) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package manager
        id: detect-pm
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          if [ -f "bun.lockb" ]; then
            echo "pm=bun" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Bun
        if: steps.detect-pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (minimal)
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            bun)
              bun add -d prettier
              ;;
            pnpm)
              pnpm add -D prettier
              ;;
            npm)
              npm install --save-dev prettier
              ;;
          esac

      - name: Run Prettier check
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            bun)
              bunx prettier --check "src/**/*.{ts,tsx,js,jsx,json}" || echo "Prettier check failed"
              ;;
            pnpm)
              pnpm exec prettier --check "src/**/*.{ts,tsx,js,jsx,json}" || echo "Prettier check failed"
              ;;
            npm)
              npx prettier --check "src/**/*.{ts,tsx,js,jsx,json}" || echo "Prettier check failed"
              ;;
          esac

  # Phase 5: SDK Compatibility Check
  sdk-compatibility:
    name: SDK Compatibility Check
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: always() && needs.detect-changes.outputs.typescript_changed == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract SDK versions
        id: extract-versions
        run: |
          echo "## MCP SDK Compatibility Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Server | SDK Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|--------|" >> $GITHUB_STEP_SUMMARY

          RECOMMENDED_VERSION="^1.25.3"
          INCOMPATIBLE_FOUND=false

          for server in $(echo '${{ needs.detect-changes.outputs.affected_servers }}' | jq -r '.[]'); do
            if [ -f "mcp_servers/$server/package.json" ]; then
              SDK_VERSION=$(jq -r '.dependencies["@modelcontextprotocol/sdk"] // .devDependencies["@modelcontextprotocol/sdk"] // "Not found"' "mcp_servers/$server/package.json")

              if [ "$SDK_VERSION" = "Not found" ]; then
                echo "| $server | ❌ Not found | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY
                INCOMPATIBLE_FOUND=true
              elif [[ "$SDK_VERSION" =~ ^[\^~]?1\.(2[5-9]|[3-9][0-9]) ]]; then
                echo "| $server | ✅ $SDK_VERSION | ✅ Compatible |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $server | ⚠️ $SDK_VERSION | ⚠️ Outdated |" >> $GITHUB_STEP_SUMMARY
                INCOMPATIBLE_FOUND=true
              fi
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Recommended Version**: $RECOMMENDED_VERSION" >> $GITHUB_STEP_SUMMARY

          if [ "$INCOMPATIBLE_FOUND" = true ]; then
            echo "incompatible=true" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Action Required**: Some servers have incompatible or missing SDK versions" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post compatibility warnings
        if: steps.extract-versions.outputs.incompatible == 'true'
        run: |
          echo "⚠️ SDK compatibility issues detected. Check job summary for details."

  # Phase 6: Summary Report
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test, typecheck, prettier, sdk-compatibility]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## TypeScript MCP CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Impact Level**: ${{ needs.detect-changes.outputs.impact_level }}" >> $GITHUB_STEP_SUMMARY
          echo "**Affected Servers**: ${{ needs.detect-changes.outputs.affected_servers }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Test: ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Check: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Prettier: ${{ needs.prettier.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SDK Compatibility: ${{ needs.sdk-compatibility.result }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-and-test.result }}" = "success" ] && \
             [ "${{ needs.typecheck.result }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All critical checks passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some checks failed - review logs above**" >> $GITHUB_STEP_SUMMARY
          fi
