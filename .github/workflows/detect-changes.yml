name: Detect Changes

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Base ref for change detection (e.g. origin/main)'
        required: false
        type: string
      head_ref:
        description: 'Head ref to checkout (e.g. PR branch name)'
        required: false
        type: string
    outputs:
      affected_servers:
        description: 'JSON array of affected MCP servers'
        value: ${{ jobs.detect.outputs.affected_servers }}
      impact_level:
        description: 'Impact level: CRITICAL, HIGH, MEDIUM, LOW'
        value: ${{ jobs.detect.outputs.impact_level }}
      typescript_changed:
        description: 'Whether TypeScript servers were changed'
        value: ${{ jobs.detect.outputs.typescript_changed }}
      python_changed:
        description: 'Whether Python tools were changed'
        value: ${{ jobs.detect.outputs.python_changed }}
      all_servers:
        description: 'JSON array of all MCP servers in the repository'
        value: ${{ jobs.detect.outputs.all_servers }}

jobs:
  detect:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      affected_servers: ${{ steps.determine-affected.outputs.affected_servers }}
      impact_level: ${{ steps.determine-impact.outputs.impact_level }}
      typescript_changed: ${{ steps.filter.outputs.typescript_servers == 'true' }}
      python_changed: ${{ steps.filter.outputs.python_tools == 'true' }}
      all_servers: ${{ steps.list-servers.outputs.all_servers }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref || github.ref }}
          fetch-depth: 0

      - name: Detect file changes
        id: filter
        run: |
          base="${{ inputs.base_ref || 'origin/main' }}"
          if [ -z "$base" ]; then base="origin/main"; fi
          changed=$(git diff --name-only "$base" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          check_path() { echo "$changed" | grep -qE "^$1"; }
          set_output() { echo "$1=$2" >> $GITHUB_OUTPUT; }

          check_path "mcp_servers/claude-mem/" && set_output "claude_mem" "true" || set_output "claude_mem" "false"
          check_path "mcp_servers/gdrive-mcp/" && set_output "gdrive_mcp" "true" || set_output "gdrive_mcp" "false"
          check_path "mcp_servers/markdownify-mcp/" && set_output "markdownify_mcp" "true" || set_output "markdownify_mcp" "false"
          check_path "mcp_servers/mcp-obsidian-src/" && set_output "mcp_obsidian" "true" || set_output "mcp_obsidian" "false"
          check_path "mcp_servers/mcp-server-kubernetes/" && set_output "mcp_kubernetes" "true" || set_output "mcp_kubernetes" "false"
          check_path "mcp_servers/Ollama-mcp/" && set_output "ollama_mcp" "true" || set_output "ollama_mcp" "false"
          check_path "mcp_servers/package/" && set_output "package_mcp" "true" || set_output "package_mcp" "false"

          ts_changed="false"
          for p in mcp_servers/claude-mem/ mcp_servers/gdrive-mcp/ mcp_servers/markdownify-mcp/ mcp_servers/mcp-obsidian-src/ mcp_servers/mcp-server-kubernetes/ mcp_servers/Ollama-mcp/ mcp_servers/package/; do
            echo "$changed" | grep -qE "^$p" && ts_changed="true" && break
          done
          set_output "typescript_servers" "$ts_changed"

          echo "$changed" | grep -qE "^tools/.*\.py" && set_output "python_tools" "true" || set_output "python_tools" "false"

          root_changed="false"
          echo "$changed" | grep -qE "^(package\.json|tsconfig\.json|\.github/workflows/|\.npmrc)" && root_changed="true"
          set_output "root_config" "$root_changed"

          echo "Changed files (count): $(echo "$changed" | grep -c . || echo 0)"

      - name: Determine affected servers
        id: determine-affected
        run: |
          affected_servers=()

          if [ "${{ steps.filter.outputs.claude_mem }}" = "true" ]; then
            affected_servers+=("claude-mem")
          fi

          if [ "${{ steps.filter.outputs.gdrive_mcp }}" = "true" ]; then
            affected_servers+=("gdrive-mcp")
          fi

          if [ "${{ steps.filter.outputs.markdownify_mcp }}" = "true" ]; then
            affected_servers+=("markdownify-mcp")
          fi

          if [ "${{ steps.filter.outputs.mcp_obsidian }}" = "true" ]; then
            affected_servers+=("mcp-obsidian-src")
          fi

          if [ "${{ steps.filter.outputs.mcp_kubernetes }}" = "true" ]; then
            affected_servers+=("mcp-server-kubernetes")
          fi

          if [ "${{ steps.filter.outputs.ollama_mcp }}" = "true" ]; then
            affected_servers+=("Ollama-mcp")
          fi

          if [ "${{ steps.filter.outputs.package_mcp }}" = "true" ]; then
            affected_servers+=("package")
          fi

          # Convert array to JSON
          json_output=$(printf '%s\n' "${affected_servers[@]}" | jq -R . | jq -s .)
          echo "affected_servers=${json_output}" >> $GITHUB_OUTPUT

          echo "Affected servers: ${affected_servers[@]}"

      - name: Determine impact level
        id: determine-impact
        run: |
          root_config_changed="${{ steps.filter.outputs.root_config }}"
          affected_count=$(echo '${{ steps.determine-affected.outputs.affected_servers }}' | jq 'length')

          if [ "$root_config_changed" = "true" ]; then
            impact_level="CRITICAL"
          elif [ "$affected_count" -gt 3 ]; then
            impact_level="HIGH"
          elif [ "$affected_count" -ge 2 ]; then
            impact_level="MEDIUM"
          elif [ "$affected_count" -eq 1 ]; then
            impact_level="LOW"
          else
            impact_level="NONE"
          fi

          echo "impact_level=${impact_level}" >> $GITHUB_OUTPUT
          echo "Impact level: ${impact_level} (${affected_count} servers affected)"

      - name: List all servers
        id: list-servers
        run: |
          # Generate list of all MCP servers in the repository
          all_servers=$(find mcp_servers -maxdepth 1 -type d ! -name 'mcp_servers' | \
                         sed 's|^mcp_servers/||' | \
                         sort | \
                         jq -R . | \
                         jq -s .)

          echo "all_servers=${all_servers}" >> $GITHUB_OUTPUT
          echo "All servers: ${all_servers}"

      - name: Summary
        run: |
          echo "## Change Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Impact Level**: ${{ steps.determine-impact.outputs.impact_level }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**TypeScript Changed**: ${{ steps.filter.outputs.typescript_servers }}" >> $GITHUB_STEP_SUMMARY
          echo "**Python Changed**: ${{ steps.filter.outputs.python_tools }}" >> $GITHUB_STEP_SUMMARY
          echo "**Root Config Changed**: ${{ steps.filter.outputs.root_config }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Affected Servers**:" >> $GITHUB_STEP_SUMMARY
          affected='${{ steps.determine-affected.outputs.affected_servers }}'
          if [ -n "$affected" ] && [ "$affected" != "[]" ]; then
            echo "$affected" | jq -r '.[] | "- \(.)"' >> $GITHUB_STEP_SUMMARY
          else
            echo "- (none)" >> $GITHUB_STEP_SUMMARY
          fi
