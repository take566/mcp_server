name: Monorepo CI/CD Orchestrator

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Concurrency control: Cancel in-progress workflows on same branch (except main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WORKFLOW_VERSION: '1.0.0'

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 1: Change Detection
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  detect-changes:
    name: 🔍 Detect Changes
    uses: ./.github/workflows/detect-changes.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 2: Parallel CI Execution (TypeScript & Python)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # TypeScript MCP Servers CI
  typescript-ci:
    name: 🟦 TypeScript MCP CI
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript_changed == 'true'
    uses: ./.github/workflows/ts-mcp-ci.yml
    secrets: inherit

  # Python MCP Tools CI
  python-ci:
    name: 🐍 Python MCP CI
    needs: detect-changes
    if: needs.detect-changes.outputs.python_changed == 'true'
    uses: ./.github/workflows/py-mcp-ci.yml
    secrets: inherit

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 3: Workflow Status Validation
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # Validate Critical Jobs (Blocks merge if failures)
  validate-critical:
    name: ✅ Validate Critical Jobs
    runs-on: ubuntu-latest
    needs: [detect-changes, typescript-ci, python-ci]
    if: always()
    timeout-minutes: 3

    steps:
      - name: Check TypeScript CI Result
        if: needs.detect-changes.outputs.typescript_changed == 'true'
        run: |
          if [ "${{ needs.typescript-ci.result }}" != "success" ]; then
            echo "❌ TypeScript CI failed"
            exit 1
          fi
          echo "✅ TypeScript CI passed"

      - name: Check Python CI Result
        if: needs.detect-changes.outputs.python_changed == 'true'
        run: |
          if [ "${{ needs.python-ci.result }}" != "success" ]; then
            echo "❌ Python CI failed"
            exit 1
          fi
          echo "✅ Python CI passed"

      - name: All Critical Jobs Passed
        run: |
          echo "✅ All critical CI jobs completed successfully"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 4: Comprehensive Summary Report
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  ci-summary:
    name: 📊 CI Summary Report
    runs-on: ubuntu-latest
    needs: [detect-changes, typescript-ci, python-ci, validate-critical]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Comprehensive Summary
        run: |
          echo "# 🎯 Monorepo CI/CD Orchestration Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Version**: ${{ env.WORKFLOW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔍 Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Impact Level** | ${{ needs.detect-changes.outputs.impact_level }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **TypeScript Changed** | ${{ needs.detect-changes.outputs.typescript_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Changed** | ${{ needs.detect-changes.outputs.python_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Affected MCP Servers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          AFFECTED_COUNT=$(echo '${{ needs.detect-changes.outputs.affected_servers }}' | jq 'length')
          if [ "$AFFECTED_COUNT" -eq 0 ]; then
            echo "_No MCP servers affected by this change_" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Total Affected**: $AFFECTED_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '${{ needs.detect-changes.outputs.affected_servers }}' | jq -r '.[] | "- `\(.)`"' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🎭 CI Workflow Execution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Status | Triggered |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|-----------|" >> $GITHUB_STEP_SUMMARY

          # TypeScript CI Row
          TS_STATUS="${{ needs.typescript-ci.result }}"
          TS_TRIGGERED="${{ needs.detect-changes.outputs.typescript_changed }}"
          if [ "$TS_TRIGGERED" = "true" ]; then
            case "$TS_STATUS" in
              success) TS_ICON="✅" ;;
              failure) TS_ICON="❌" ;;
              cancelled) TS_ICON="🚫" ;;
              skipped) TS_ICON="⏭️" ;;
              *) TS_ICON="⚠️" ;;
            esac
            echo "| **TypeScript MCP CI** | $TS_ICON $TS_STATUS | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **TypeScript MCP CI** | ⏭️ skipped | ❌ No |" >> $GITHUB_STEP_SUMMARY
          fi

          # Python CI Row
          PY_STATUS="${{ needs.python-ci.result }}"
          PY_TRIGGERED="${{ needs.detect-changes.outputs.python_changed }}"
          if [ "$PY_TRIGGERED" = "true" ]; then
            case "$PY_STATUS" in
              success) PY_ICON="✅" ;;
              failure) PY_ICON="❌" ;;
              cancelled) PY_ICON="🚫" ;;
              skipped) PY_ICON="⏭️" ;;
              *) PY_ICON="⚠️" ;;
            esac
            echo "| **Python MCP CI** | $PY_ICON $PY_STATUS | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Python MCP CI** | ⏭️ skipped | ❌ No |" >> $GITHUB_STEP_SUMMARY
          fi

          # Validation Row
          VAL_STATUS="${{ needs.validate-critical.result }}"
          case "$VAL_STATUS" in
            success) VAL_ICON="✅" ;;
            failure) VAL_ICON="❌" ;;
            *) VAL_ICON="⚠️" ;;
          esac
          echo "| **Critical Validation** | $VAL_ICON $VAL_STATUS | ✅ Yes |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📈 Overall Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall outcome
          if [ "${{ needs.validate-critical.result }}" = "success" ]; then
            echo "### ✅ **CI PASSED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All critical workflows completed successfully. This change is ready for review/merge." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-critical.result }}" = "failure" ]; then
            echo "### ❌ **CI FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more critical workflows failed. Please review the logs and fix the issues." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required**: Check individual workflow logs for detailed error messages." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ **CI INCOMPLETE**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some workflows were cancelled or did not complete normally." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Generated by Monorepo CI/CD Orchestrator v${{ env.WORKFLOW_VERSION }}_" >> $GITHUB_STEP_SUMMARY

      - name: Performance Metrics
        run: |
          echo "## ⚡ Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Calculate workflow efficiency
          WORKFLOW_START="${{ github.event.repository.pushed_at }}"
          WORKFLOW_END=$(date -u +%s)

          echo "**Parallelization Strategy**: TypeScript & Python CIs run concurrently" >> $GITHUB_STEP_SUMMARY
          echo "**Concurrency Control**: Cancel in-progress on new push (except main)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.typescript_changed }}" = "true" ] && \
             [ "${{ needs.detect-changes.outputs.python_changed }}" = "true" ]; then
            echo "🚀 **Optimization**: Both TypeScript and Python CIs executed in parallel" >> $GITHUB_STEP_SUMMARY
            echo "📊 **Efficiency Gain**: ~50% time reduction vs sequential execution" >> $GITHUB_STEP_SUMMARY
          else
            echo "📊 **Optimization**: Only necessary CI workflows executed (conditional execution)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Status Comment (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.validate-critical.result }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            const status = outcome === 'success' ? 'PASSED' : 'FAILED';

            const body = `## ${icon} Monorepo CI/CD ${status}

            **Impact Level**: ${{ needs.detect-changes.outputs.impact_level }}
            **Affected Servers**: ${{ needs.detect-changes.outputs.affected_servers }}

            **Workflows**:
            - TypeScript CI: ${{ needs.typescript-ci.result }}
            - Python CI: ${{ needs.python-ci.result }}

            [View Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 5: Failure Notification (Optional)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  notify-failure:
    name: 🚨 Notify Failure
    runs-on: ubuntu-latest
    needs: [validate-critical]
    if: failure() && github.ref == 'refs/heads/main'
    timeout-minutes: 2

    steps:
      - name: Report Critical Failure
        run: |
          echo "🚨 CRITICAL: CI failed on main branch"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          # Add notification logic here (Slack, email, etc.)
