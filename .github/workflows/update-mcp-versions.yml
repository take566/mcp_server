name: Update MCP versions

on:
  schedule:
    # Bi-monthly: 1st and 15th of every month, 00:00 UTC
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-mcp-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Sync @modelcontextprotocol/sdk across workspaces
        run: node scripts/sync-sdk.mjs

      - name: Refresh root package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: deps/update-mcp-versions
          commit-message: "chore(deps): update @modelcontextprotocol/* to latest"
          title: "chore(deps): update @modelcontextprotocol/* to latest"
          body: |
            Automated update of `@modelcontextprotocol/sdk` across all npm workspaces (`node scripts/sync-sdk.mjs` + root lockfile refresh).
            Please review and run CI before merging.
          labels: dependencies
