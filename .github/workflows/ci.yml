name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.svg'
      - '**/*.png'
      - '.gitignore'
      - '**/.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.svg'
      - '**/*.png'
      - '.gitignore'
      - '**/.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Phase 1: Change Detection (Python only; Node workspaces always run)
  # --------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      py_changed: ${{ steps.filter.outputs.py_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")

          if echo "$CHANGED" | grep -qE "^tools/.*\.(py|toml)$"; then
            echo "py_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "py_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Python changed: $(grep py_changed "$GITHUB_OUTPUT" | cut -d= -f2)"

  # --------------------------------------------------------------------------
  # Phase 2a: Node workspaces (npm ci + typecheck + lint + test + build)
  # --------------------------------------------------------------------------
  node:
    name: Node workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:all

  # --------------------------------------------------------------------------
  # Phase 2b: Python Tools (lint + test)
  # --------------------------------------------------------------------------
  python:
    name: Python [tools/llm-script]
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.py_changed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "tools/llm-script/pyproject.toml"

      - name: Install
        working-directory: tools/llm-script
        run: uv sync --all-extras

      - name: Ruff check
        working-directory: tools/llm-script
        run: uv run ruff check . --output-format=github

      - name: Ruff format
        working-directory: tools/llm-script
        run: uv run ruff format --check .

      - name: Pytest
        working-directory: tools/llm-script
        run: |
          if [ -d "tests" ]; then
            uv run pytest --tb=short
          else
            echo "No tests/ directory, skipping"
          fi

  # --------------------------------------------------------------------------
  # Phase 3: Gate (required status check for branch protection)
  # --------------------------------------------------------------------------
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [changes, node, python]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        run: |
          CHANGES_RESULT="${{ needs.changes.result }}"
          NODE_RESULT="${{ needs.node.result }}"
          PY_RESULT="${{ needs.python.result }}"

          echo "Changes: ${CHANGES_RESULT}"
          echo "Node:    ${NODE_RESULT}"
          echo "Python:  ${PY_RESULT}"

          if [ "$NODE_RESULT" != "success" ]; then
            echo "CI failed: Node workspaces got '${NODE_RESULT}'"
            exit 1
          fi
          # Python may be skipped when no Python files changed
          for result in "$CHANGES_RESULT" "$PY_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "CI failed: got result '${result}'"
              exit 1
            fi
          done

          echo "All checks passed or were skipped"
