name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.svg'
      - '**/*.png'
      - '.gitignore'
      - '**/.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.svg'
      - '**/*.png'
      - '.gitignore'
      - '**/.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # --------------------------------------------------------------------------
  # Phase 1: Change Detection
  # --------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts_servers: ${{ steps.filter.outputs.ts_servers }}
      ts_matrix: ${{ steps.matrix.outputs.ts_matrix }}
      py_changed: ${{ steps.filter.outputs.py_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")

          # TypeScript servers: check each directory under mcp_servers/
          TS_SERVERS=()
          for dir in mcp_servers/*/; do
            name=$(basename "$dir")
            # Skip non-TS directories (no package.json)
            [ ! -f "$dir/package.json" ] && continue
            if echo "$CHANGED" | grep -q "^mcp_servers/${name}/"; then
              TS_SERVERS+=("$name")
            fi
          done

          # Root config changes trigger all TS servers
          if echo "$CHANGED" | grep -qE "^(\.github/workflows/ci\.yml)$"; then
            for dir in mcp_servers/*/; do
              name=$(basename "$dir")
              [ ! -f "$dir/package.json" ] && continue
              # Add only if not already present
              if [[ ! " ${TS_SERVERS[*]} " =~ " ${name} " ]]; then
                TS_SERVERS+=("$name")
              fi
            done
          fi

          if [ ${#TS_SERVERS[@]} -gt 0 ]; then
            echo "ts_servers=true" >> $GITHUB_OUTPUT
          else
            echo "ts_servers=false" >> $GITHUB_OUTPUT
          fi

          # Python changes
          if echo "$CHANGED" | grep -qE "^tools/.*\.(py|toml)$"; then
            echo "py_changed=true" >> $GITHUB_OUTPUT
          else
            echo "py_changed=false" >> $GITHUB_OUTPUT
          fi

          # Store server list for matrix step
          printf '%s\n' "${TS_SERVERS[@]}" > /tmp/ts_servers.txt
          echo "Detected TS servers: ${TS_SERVERS[*]}"
          echo "Python changed: $(grep py_changed $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Build matrix
        id: matrix
        run: |
          if [ -f /tmp/ts_servers.txt ] && [ -s /tmp/ts_servers.txt ]; then
            MATRIX=$(cat /tmp/ts_servers.txt | jq -R . | jq -sc .)
          else
            MATRIX="[]"
          fi
          echo "ts_matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Matrix: ${MATRIX}"

  # --------------------------------------------------------------------------
  # Phase 2a: TypeScript MCP Servers (build + typecheck + test)
  # --------------------------------------------------------------------------
  typescript:
    name: TS [${{ matrix.server }}]
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts_servers == 'true'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.changes.outputs.ts_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package manager
        id: pm
        working-directory: mcp_servers/${{ matrix.server }}
        run: |
          if [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
            echo "name=bun" >> $GITHUB_OUTPUT
            echo "install=bun install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "build=bun run build" >> $GITHUB_OUTPUT
            echo "test=bun test" >> $GITHUB_OUTPUT
            echo "typecheck=bunx tsc --noEmit" >> $GITHUB_OUTPUT
            echo "needs_bun=true" >> $GITHUB_OUTPUT
            echo "needs_pnpm=false" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "name=pnpm" >> $GITHUB_OUTPUT
            echo "install=pnpm install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "build=pnpm run build" >> $GITHUB_OUTPUT
            echo "test=pnpm test" >> $GITHUB_OUTPUT
            echo "typecheck=pnpm exec tsc --noEmit" >> $GITHUB_OUTPUT
            echo "needs_bun=false" >> $GITHUB_OUTPUT
            echo "needs_pnpm=true" >> $GITHUB_OUTPUT
          else
            echo "name=npm" >> $GITHUB_OUTPUT
            echo "install=npm ci" >> $GITHUB_OUTPUT
            echo "build=npm run build" >> $GITHUB_OUTPUT
            echo "test=npm test" >> $GITHUB_OUTPUT
            echo "typecheck=npx tsc --noEmit" >> $GITHUB_OUTPUT
            echo "needs_bun=false" >> $GITHUB_OUTPUT
            echo "needs_pnpm=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.pm.outputs.needs_pnpm == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Bun
        if: steps.pm.outputs.needs_bun == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: mcp_servers/${{ matrix.server }}/node_modules
          key: ${{ runner.os }}-${{ steps.pm.outputs.name }}-${{ matrix.server }}-${{ hashFiles(format('mcp_servers/{0}/*lock*', matrix.server), format('mcp_servers/{0}/package.json', matrix.server)) }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pm.outputs.name }}-${{ matrix.server }}-

      - name: Install
        working-directory: mcp_servers/${{ matrix.server }}
        run: ${{ steps.pm.outputs.install }}

      - name: Build
        working-directory: mcp_servers/${{ matrix.server }}
        run: ${{ steps.pm.outputs.build }}

      - name: Typecheck
        working-directory: mcp_servers/${{ matrix.server }}
        continue-on-error: true
        run: |
          if grep -q '"typecheck"' package.json; then
            ${{ steps.pm.outputs.name }} run typecheck
          else
            ${{ steps.pm.outputs.typecheck }}
          fi

      - name: Test
        working-directory: mcp_servers/${{ matrix.server }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if grep -q '"test"' package.json; then
            ${{ steps.pm.outputs.test }} || echo "Tests failed or not configured"
          else
            echo "No test script defined, skipping"
          fi

  # --------------------------------------------------------------------------
  # Phase 2b: Python Tools (lint + test)
  # --------------------------------------------------------------------------
  python:
    name: Python [tools/llm-script]
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.py_changed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "tools/llm-script/pyproject.toml"

      - name: Install
        working-directory: tools/llm-script
        run: uv sync --all-extras

      - name: Ruff check
        working-directory: tools/llm-script
        run: uv run ruff check . --output-format=github

      - name: Ruff format
        working-directory: tools/llm-script
        run: uv run ruff format --check .

      - name: Pytest
        working-directory: tools/llm-script
        run: |
          if [ -d "tests" ]; then
            uv run pytest --tb=short
          else
            echo "No tests/ directory, skipping"
          fi

  # --------------------------------------------------------------------------
  # Phase 3: Gate (required status check for branch protection)
  # --------------------------------------------------------------------------
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [changes, typescript, python]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        run: |
          TS_RESULT="${{ needs.typescript.result }}"
          PY_RESULT="${{ needs.python.result }}"

          echo "TypeScript: ${TS_RESULT}"
          echo "Python:     ${PY_RESULT}"

          # 'success' or 'skipped' are acceptable
          for result in "$TS_RESULT" "$PY_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "CI failed: got result '${result}'"
              exit 1
            fi
          done

          echo "All checks passed or were skipped"
