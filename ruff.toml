# Ruff configuration for Python MCP servers
# Documentation: https://docs.astral.sh/ruff/

# Exclude directories
extend-exclude = [
    ".venv",
    "venv",
    "env",
    ".git",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]

# Line length
line-length = 120

# Python version
target-version = "py311"

[lint]
# Enable rule categories
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",     # Line too long (handled by formatter)
    "PLR0913",  # Too many arguments (common in MCP servers)
    "PLR2004",  # Magic value used in comparison (allow for constants)
    "N802",     # Function name should be lowercase (allow MCP naming)
    "N803",     # Argument name should be lowercase (allow MCP naming)
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore specific rules in specific files
"__init__.py" = ["F401"]  # Unused imports in init files
"**/tests/**" = ["PLR2004", "S101"]  # Magic values and asserts in tests
"**/*_test.py" = ["PLR2004", "S101"]
"**/test_*.py" = ["PLR2004", "S101"]

[lint.isort]
# isort configuration
known-first-party = ["llm_script", "markdownify_mcp"]
force-single-line = false
lines-after-imports = 2

[lint.pylint]
# Pylint configuration
max-args = 8
max-branches = 15
max-returns = 6
max-statements = 60

[format]
# Formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Respect .gitignore exclusions
respect-gitignore = true
